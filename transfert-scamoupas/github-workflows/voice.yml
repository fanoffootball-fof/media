name: Voix off ElevenLabs

# Se lance quand une spec est poussée (par la tâche quotidienne) : génère les répliques "say" qui manquent.
# À la main depuis l'onglet Actions (« Run workflow ») avec « check » : vérifie la clé et crée des échantillons.
on:
  push:
    branches: [main]
    paths: ["specs/*.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "check = vérifier la clé et créer des échantillons ; process = générer les voix en attente"
        type: choice
        options: [check, process]
        default: check

concurrency:
  group: voice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la clé et créer des échantillons
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        run: python3 tools/tts.py --check
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}

      - name: Générer les voix en attente
        if: github.event_name == 'push' || inputs.mode == 'process'
        run: python3 tools/tts.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}

      - name: Enregistrer les voix
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ -d voice ]; then git add voice; fi
          if ! git diff --cached --quiet; then
            git commit -m "Voix off : fichiers générés"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
